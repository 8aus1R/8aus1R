<svg xmlns="http://www.w3.org/2000/svg" width="884" height="506" viewBox="0 0 884 506" role="img" aria-labelledby="title desc">
  <title id="title">数据库学习路线</title>
  <desc id="desc">基于 8aus1R/database-competition-projects 现有目录整理的阅读导览：存储与记录、B+ 树与索引、查询处理、查询优化。模块名称来自 RMDB 代码副本的 src 目录。这是阅读导航，不表示程序执行顺序或实现验收结果。</desc>
  <rect x="1" y="1" width="882" height="504" rx="18" fill="#0d1117" stroke="#303c4b"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
    <text x="32" y="42" font-size="12" font-weight="600" letter-spacing="2" fill="#80b8e8">DATABASE PRACTICE</text>
    <text x="32" y="78" font-size="28" font-weight="700" fill="#e6edf3">数据库学习路线</text>
    <text x="32" y="102" font-size="14" fill="#9baabd">从底层到查询处理，按主题浏览笔记与源码。</text>
    <g transform="translate(32 120)">
      <rect width="400" height="144" rx="12" fill="#141c27" stroke="#2a384a"/>
      <text x="20" y="32" font-size="13" font-weight="600" fill="#80b8e8">01</text>
      <text x="54" y="33" font-size="20" font-weight="650" fill="#e6edf3">存储与记录</text>
      <text x="20" y="64" font-size="15" fill="#b2bdca">页、缓冲池、记录组织</text>
      <text x="20" y="95" font-size="13" fill="#80b8e8" font-family="Consolas,'SFMono-Regular',monospace">storage · record · replacer</text>
      <text x="20" y="123" font-size="13" fill="#9baabd">笔记目录 / 存储管理部分</text>
    </g>
<g transform="translate(452 120)">
      <rect width="400" height="144" rx="12" fill="#141c27" stroke="#2a384a"/>
      <text x="20" y="32" font-size="13" font-weight="600" fill="#80b8e8">02</text>
      <text x="54" y="33" font-size="20" font-weight="650" fill="#e6edf3">B+ 树与索引</text>
      <text x="20" y="64" font-size="15" fill="#b2bdca">索引笔记与简单 C++ 练习</text>
      <text x="20" y="95" font-size="13" fill="#80b8e8" font-family="Consolas,'SFMono-Regular',monospace">index</text>
      <text x="20" y="123" font-size="13" fill="#9baabd">笔记目录 / 索引-B+树部分</text>
    </g>
<g transform="translate(32 284)">
      <rect width="400" height="144" rx="12" fill="#141c27" stroke="#2a384a"/>
      <text x="20" y="32" font-size="13" font-weight="600" fill="#80b8e8">03</text>
      <text x="54" y="33" font-size="20" font-weight="650" fill="#e6edf3">查询处理</text>
      <text x="20" y="64" font-size="15" fill="#b2bdca">解析、语义分析与算子执行</text>
      <text x="20" y="95" font-size="13" fill="#80b8e8" font-family="Consolas,'SFMono-Regular',monospace">parser · analyze · execution</text>
      <text x="20" y="123" font-size="13" fill="#9baabd">笔记目录 / 查询执行部分</text>
    </g>
<g transform="translate(452 284)">
      <rect width="400" height="144" rx="12" fill="#141c27" stroke="#2a384a"/>
      <text x="20" y="32" font-size="13" font-weight="600" fill="#80b8e8">04</text>
      <text x="54" y="33" font-size="20" font-weight="650" fill="#e6edf3">查询优化</text>
      <text x="20" y="64" font-size="15" fill="#b2bdca">查询计划与优化思路</text>
      <text x="20" y="95" font-size="13" fill="#80b8e8" font-family="Consolas,'SFMono-Regular',monospace">optimizer</text>
      <text x="20" y="123" font-size="13" fill="#9baabd">笔记目录 / 查询优化部分</text>
    </g>
    <text x="32" y="459" font-size="13" fill="#b2bdca">源码阅读：选择一个 RMDB 代码副本，再沿 src 下的对应模块阅读。</text>
    <text x="32" y="483" font-size="12" fill="#8393a6">基于仓库目录的阅读导览 · 不表示程序执行顺序或实现验收结果</text>
  </g>
</svg>

